      Port Rails' page cache. A read-only SQLite observer reads PRAGMA data_version (commits from
      any writer, Rails included); the version is captured before authentication, checked at
      lookup and again before a rendered page is admitted. Authenticated GET HTML for room,
      messages, sidebar and search is cached complete, as identity and gzip bodies with a
      precomputed weak ETag and Vary: Accept-Encoding, keyed as response_cache_key is, within
      CAMPFIRE_RESPONSE_CACHE_MB (default 64, 0 disables), 1 MiB per entry, FIFO eviction. Every
      hit still authenticates and authorizes against current records. 16 render locks collapse
      concurrent cold misses. Skip as Rails skips: bot keys, flash, conditional requests, open
      transactions, non-200, changed session. Nested message, boost and list fragments use a
      separate 64 MiB store keyed by the captured version, origin, mount path, format, locale and
      viewer/session digest, with content-validated message fragments kept across unrelated
      commits as Rails keeps them. Port all five reference test files listed in refs. Measure
      before/after with bench/bin/run on room, messages, sidebar and search (internal only).
    accept:
      - Ported cache tests pass, including foreign-writer invalidation (Rails writes, C# serves fresh) and no cross-user or cross-session reuse
      - Replay gate is green with the cache on and with CAMPFIRE_RESPONSE_CACHE_MB=0
      - Internal before/after numbers recorded in plans/status/U07.md

