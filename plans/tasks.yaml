    deliver: >
      Move the reference/ submodule from 345e637 to basecamp/once-campfire@edbc779 (main on
      2026-10-09; the v1.5.2 tag predates the cache work). Besides src/ and tests/, this task may
      edit the submodule pointer, the pin named in AGENTS.md, plans/csharp-port.md and
      assets/README.md, and regenerate parity/.seed/. Rebuild campfire-reference:app (Ruby 4.0.7,
      Puma 8) with parity/bin/reference, rebuild and verify the default seed (the schema gains
      rooms.messages_count and two message indexes), and rebuild the frontend assets (four
      Stimulus controllers and file_uploader.js changed). Check which Rails tree the benchmark's
      reference image is built from (reference/ or reference-rust/reference/) and make it ours.
      Then run every parity gate (replay, route coverage, screens, cable, state, continuity,
      workflows) against the new reference and write plans/upstream-sync.md: (1) every
      first-parent upstream commit from 345e637 to edbc779 that touches app/, config/, lib/ or
      db/, each mapped to the U task that ports it (U02-U08; flag any that fit none), and (2)
      every gate failure, each mapped the same way. Don't port behavior here. Keep bin/check
      green with the smallest changes: a test that now fails because Rails changed is skipped
      with a reason naming the U task that fixes it, and that task removes the skip.
