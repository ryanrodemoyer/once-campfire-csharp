      SanitizeAttributes -> Action Text sanitizer allowlist -> auto_link re-sanitization;
      opengraph embed URL constraints relative to request host.
    accept:
      - Independent security assertions hold on all outputs - no script, no on* attributes, no javascript URLs, no style outside the allowlist
      - Sanitized output matches the reference on the rich text vectors

