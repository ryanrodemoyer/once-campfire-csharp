  - id: D03
    title: Lifecycle callbacks and domain event seams
    lane: D
    milestone: M1
    size: M
    deps: [D02]
    owns: [src/Campfire.Data/Lifecycle/, src/Campfire.Data/Events/]
    refs: [reference/app/models/message.rb, reference/app/models/message/broadcasts.rb, reference/app/models/boost.rb, reference/app/models/user.rb, reference/app/models/user/bannable.rb, reference-rust/reference-tools/campfire/callbacks.rb]
    deliver: >
      Ordered, transactional side effects: message create touches room, updates unread
      memberships, indexes FTS after commit, enqueues push and webhook; boost touches message;
      user create grants open-room memberships; deactivate/ban destroys sessions. Defines the
