    deliver: >
      `campfire server` serves only the router: nothing in src/ builds the WebApp, the cable server,
      the job runner or the connection revoker; only tests do. Compose the real thing in
      src/Campfire.Server/Composition/: WebApp with the real Database, Keys, Storage and assets;
      CableServer mounted at /cable with session-cookie authentication; JobRunner processing jobs
      in-process (Rails runs Resque workers beside Puma; JOB_CONCURRENCY sizes them); the revoker
      wired to the cable server; DomainSeams built from those three, never no-ops. Mirror
      tests/workflows/Server.cs, but with real jobs. B02 may have landed a temporary
      ServerCommand with no-op seams to get the benchmark running; replace it. Also set
      WebApp.ResetRemoteConnections to disconnect the user's cable connections (sign out, per
      user.rb reset_remote_connections), and register every job handler with the runner
      (MessageAttachmentJobs, AttachmentsJobs and the other RegisterWith methods). The requests
      on #26 spell out the cable mount.
