  - id: R04
    title: Rich text gate and differential fuzzing
    lane: R
    milestone: M4
    size: L
    deps: [R05]
    # The fuzzer found divergences in code owned by merged tasks, so R04 took over those paths
    # to fix them itself (R02, R03, C04, M02, I02, and the mention code in M05's and I05's
    # controllers). The owners' issues hold the findings: #20, #27, #17, #43, #41.
    owns:
      - tests/Campfire.RichText.Fuzz/
      - src/Campfire.RichText/Sanitize/
      - src/Campfire.RichText/Attachments/
      - src/Campfire.RailsCompat/GlobalId/
      - src/Campfire.Web/Helpers/Messages/
      - src/Campfire.Jobs/WebPush/
      - src/Campfire.Web/Controllers/Messages/WriteController.cs
      - src/Campfire.Web/Controllers/Messages/ByBotsController.cs
    refs: [vectors/, reference-rust/reference-tools/richtext]
    deliver: >
      All six outputs across the 658 reference cases plus a differential fuzzer (OWASP XSS
      corpus, malformed nesting, huge inputs, Unicode edge cases, every SGID variant)
      against the reference sanitizer.
      Handoff: the first attempt (commit 476b50c on this branch) built the gate and the fuzzer;
      631/658 cases pass. The 27 failures and the fuzzer's other findings are written up on
      #20 (sanitizer and content filters), #27 (attachments, auto_link), #17 (GlobalID
      parsing), #43 (message helpers) and #41 (mentioned users). Fix #43's first item first:
      a message body whose plain text raises makes the whole room page 500 instead of
      rendering that one message blank, which any member can trigger. Prove it with a
      controller test. In WriteController and ByBotsController, change only the mentioned-users
      code. If a fix belongs in src/Campfire.RichText/Html/ (R01), such as Nokogiri's
      null-byte check, file an issue instead.
    accept:
      - 658/658 cases equal on all six outputs
      - 1M fuzz iterations with zero disagreements and zero security-assertion failures

