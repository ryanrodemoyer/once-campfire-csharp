    refs: [reference/app/models/user/transferable.rb, reference/lib/rails_ext/action_text_attachables.rb, vectors/rails_compat.json]
    deliver: >
      Signed IDs (avatar no expiry, transfer 4h), GlobalID/SGID parse and generate,
      Turbo.signed_stream_verifier_key derivation and signed stream names, and the
      User-only invalid-SGID fallback including Marshal-era payloads.
    accept:
      - All signed-id, sgid and stream-name vectors pass
      - A tampered SGID for any model other than User is rejected (named test)

  - id: C05
    title: Rails params parser
    lane: C
    milestone: M1
    size: M
    deps: [V03]
    owns: [src/Campfire.RailsCompat/Params/]
    refs: [vectors/rails_compat.json]
    deliver: >
      Nested params from query, urlencoded, multipart (streaming to temp files) and JSON
