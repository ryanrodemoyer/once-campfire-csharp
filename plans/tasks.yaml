    accept:
      - Params vectors parse to identical trees
      - Multipart uploads stream without buffering the whole body in memory

  - id: C06
    title: Ruby and ActiveSupport formatting helpers
    lane: C
    milestone: M0
    size: M
    deps: [V03]
    owns: [src/Campfire.RailsCompat/Ruby/, src/Campfire.RailsCompat/Formatting/]
    refs: [reference/config/initializers/time_formats.rb, reference/lib/rails_ext/string.rb, reference/app/helpers/time_helper.rb, vectors/ruby_core.json]
    deliver: >
