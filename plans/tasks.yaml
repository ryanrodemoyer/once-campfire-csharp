    lane: R
    milestone: M1
    size: L
    deps: [R01, C06]
    owns: []  # src/Campfire.RichText/Sanitize/ passed to R04
    refs: [reference/app/helpers/content_filters, reference/lib/rails_ext/action_text_allowed_tags.rb, reference/lib/rails_ext/actiontext_opengraph_embeds.rb, reference/app/helpers/rich_text_helper.rb]
    deliver: >
