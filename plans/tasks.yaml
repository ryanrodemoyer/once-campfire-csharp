# Task graph for the C# port of Campfire.
#
# This file is the source of truth for scope and ordering. `plans/bin/plan` validates it
# (unique ids, known deps, no cycles), computes waves and the critical path, lists tasks that
# are ready to claim, and regenerates plans/dag.md. Completion is recorded per task in
# plans/status/<ID>.md, never by editing this file, so parallel agents don't conflict.
#
# Fields
#   id         stable identifier; lane prefix + number
#   title      short imperative name
#   lane       work stream (see `lanes`)
#   milestone  earliest milestone that needs it (see `milestones`)
#   size       S (<~500 LOC, ~0.5 agent-day), M (~500-1500, ~1 day), L (~1500-3000, ~2 days)
#   deps       ids that must be done first (hard dependencies only)
#   bench      true if it is on the path to the five README benchmark workloads
#   owns       paths this task creates or is the owner of; other tasks don't edit them
#   refs       reference sources to read (reference/ = Rails, reference-rust/ = Rust port)
#   deliver    what the task produces
#   accept     acceptance criteria; each one must be evidenced in plans/status/<ID>.md

lanes:
  F:  Foundation
  V:  Oracle (reference app, seed, vectors)
  C:  Rails compatibility core
  D:  Data
  R:  Rich text
  S:  Storage and media
  W:  Web layer
  A:  Accounts and auth features
  M:  Rooms and messages features
  RT: Realtime (Action Cable)
  I:  Integrations and jobs
  P:  Packaging and operations
  Q:  Parity and QA gates
  VS: Vertical slice gate
  B:  Benchmarks and performance
  U:  Upstream sync (moving the Rails pin)
  X:  Launch

milestones:
  M0: Foundation (repo, toolchain, oracle, vectors)
  M1: Vertical slice (Rails cookie works, room renders, post + broadcast, Rails boots on C# data)
  M2: Benchmark five (room, messages, sidebar, search, post at HTML parity; first internal numbers)
  M3: Feature complete (every route implemented)
  M4: Parity gates green (replay, screens, cable, state, security)
  M5: Optimized, measured, published

tasks:
  # ---------------------------------------------------------------- Foundation
  - id: F01
    title: Restructure repo around pinned references
    lane: F
    milestone: M0
    size: S
    deps: []
    owns: [.gitmodules, reference/, reference-rust/, AGENTS.md, CLAUDE.md]
    refs: [reference-rust/AGENTS.md, once-campfire-go/AGENTS.md]
    deliver: >
      Move the Rails app out of the repo root into submodule reference/ pinned to
      basecamp/once-campfire@345e637 and add reference-rust/ pinned to
      basecamp/once-campfire-rust@ccece30. Keep plans/. Write AGENTS.md/CLAUDE.md with the
      port rules from plans/csharp-port.md (never edit reference*, tests beside code, oracle
      over intuition, never benchmark an incomplete response). Replace README.md with a short
      "work in progress, see plans/" stub; X01 owns its final content.
    accept:
      - git submodule update --init --recursive yields both references at the pinned SHAs
      - Repo root has no Rails app code left; plans/ intact
      - AGENTS.md and CLAUDE.md state the swarm rules and the task-claim protocol

  - id: F02
    title: Scaffold the .NET solution
    lane: F
    milestone: M0
    size: M
    deps: [F01]
    owns: [Campfire.slnx, global.json, Directory.Build.props, Directory.Packages.props, .editorconfig, src/*/*.csproj, tests/*/*.csproj]
    refs: [plans/csharp-port.md#stack, plans/csharp-port.md#repository-layout]
    deliver: >
      .NET 10 (LTS) solution pinned via global.json with the projects listed in the layout
      section, central package management, nullable + warnings-as-errors + analyzers,
      xUnit v3 test projects beside each library, and an empty Campfire.Server that serves
      /up -> 200.
    accept:
      - dotnet build -c Release and dotnet test pass with zero warnings
      - Project reference graph matches the layout section (no cycles, Web does not reference Server)
      - dotnet format --verify-no-changes passes

  - id: F03
    title: CI and agent dev environment
    lane: F
    milestone: M0
    size: S
    deps: [F02]
    owns: [.github/workflows/, bin/check, bin/setup, .claude/]
    refs: [once-campfire-go/bin/check]
    deliver: >
      bin/setup (installs the pinned .NET SDK, inits submodules), bin/check (format, build,
      test, plans/bin/plan validate), a GitHub Actions workflow running bin/check on PRs, and
      a Claude Code SessionStart hook so cloud agent sessions boot with the SDK installed.
    accept:
      - A fresh cloud session can run bin/check without manual setup
      - CI runs on PRs and fails on a planted format error and a planted cycle in tasks.yaml

  - id: F04
    title: Frontend assets and importmap, byte for byte
    lane: F
    milestone: M0
    size: M
    deps: [F02]
    owns: [assets/, bin/build-assets, src/Campfire.Web/Assets/]
    refs: [reference/app/assets, reference/app/javascript, reference/config/importmap.rb, reference/Gemfile.lock, reference-rust/crates/assets]
    deliver: >
      Script that assembles the exact frontend from pinned sources (app JS/CSS/images/sounds,
      vendored Turbo, Stimulus, Lexxy, Action Cable client, request.js, highlight.js at the
      Gemfile.lock versions) with Propshaft-compatible digested filenames, an asset manifest,
      and the importmap JSON. Static serving with far-future immutable caching.
    accept:
      - Every /assets/* path the reference emits for the seed pages exists with identical bytes
      - Generated importmap JSON equals the reference's javascript_importmap_tags output
      - No Ruby or Node needed at build time

  # ---------------------------------------------------------------- Oracle
  - id: V01
    title: Reference app runner in production mode
    lane: V
    milestone: M0
    size: M
    deps: [F01, V03]
    owns: [parity/bin/reference, parity/docker/, parity/.env.reference, compose.parity.yml]
    refs: [reference-rust/parity/bin/reference, reference-rust/parity/docker, reference/Dockerfile]
    deliver: >
      Build and run the pinned Rails app as campfire-reference:app in production mode (CSRF,
      caching and show_exceptions on), plus a compose file that runs reference and candidate
      side by side on identical copies of a seed. Reuse the Rust port's tooling where possible.
    accept:
      - parity/bin/reference build && up serves /up and a logged-in room page
      - Candidate slot accepts any image exposing port 3000 with the same env contract
      - The imported vector generators (reference-tools/) run against this reference and reproduce vectors/

  - id: V02
    title: Shared parity and benchmark seed
    lane: V
    milestone: M0
    size: S
    deps: [V01]
    owns: [parity/bin/seed, parity/.seed/]
    refs: [reference-rust/parity/bin/seed, reference-rust/reference-tools/storage/generate.rb]
    deliver: >
      Generate the default seed (SQLite db/, storage files/, labels.json) with the reference
      app, identical to the one the Rust/Go benchmarks use, and record its hashes.
    accept:
      - labels.json contains rooms.watercooler, messages.busy_060, emails.david, passwords.all
      - Seed hashes recorded in parity/.seed/SEED.sha256 and reproducible across two runs

  - id: V03
    title: Golden vectors and C# loader
    lane: V
    milestone: M0
    size: M
    deps: [F02]
    owns: [vectors/, reference-tools/, tests/Campfire.Vectors/]
    refs: [reference-rust/vectors, reference-rust/reference-tools]
    deliver: >
      Import the Rust port's reference-generated vectors (rails_compat, ruby_core,
      campfire_routes, campfire_sessions, campfire_user_agents, storage, rich text cases,
      opengraph, webhook) with their generator scripts, plus a tiny test library that loads
      them as typed theory data for xUnit.
    accept:
      - Committed vectors are byte-identical to reference-rust/vectors at the pinned SHA (hash manifest)
      - Vector loader exposes each family as MemberData for xUnit theories

  # ---------------------------------------------------------------- Rails compatibility
  - id: C01
    title: Rails crypto primitives
    lane: C
    milestone: M0
