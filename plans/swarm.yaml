# Local multi-vendor swarm: who runs what. Read by plans/bin/swarm.
#
# Each agent works up to `slots` tasks at a time, each in its own worktree at ../campfire-wt/<ID>,
# taking the first tasks in its queue whose dependencies have all merged. Queues are balanced by size
# (S=1, M=2, L=4 points) and keep each dependency chain with one agent to avoid handoffs.
#
# Rules the queues encode:
# - Security work is reviewed across vendors: R04 and RT04 were written by Claude, GLM, Grok and Gemini,
#   so DeepSeek (dspro) reviews them in Q08, and the second security review (Q13) too.
# - Batch 2 (the upstream sync, U01-U08, and the fixes from issues #161 and #184-#191): Claude takes
#   the hard, security-critical work (the pin, forgery protection, the page cache, perf round 2),
#   Gemini the ports and gates, Haiku the small fixes, and dspro reviews every PR before it merges.
# - Benchmark tasks are `exclusive`: they start only on an idle machine and nothing else starts
#   while they run, so build load never leaks into a measurement.
# - B05 and X02 are labelled `human` and never appear here.

worktrees: ../campfire-wt
max_attempts: 3
retry_after_minutes: 45
poll_seconds: 120
exclusive: [B02, B03, B04, B07, B08, B09]
# Allowed to start while a benchmark task drains the machine: they were already running.
drain_exempt: [R04, M10]
# May edit src/ and tests/ (and other paths their card names) beyond their `owns`: their work fixes
# code whose owners have all merged. Concurrent ones resolve conflicts by merging main.
edit_anywhere: [B03, Q10, Q14, U01, U02, U03, U04, U05, U06, U07, U08, Q11, Q12, Q13, R06, P07, P08, B07, B08, B09]
# Each listed task's green PR is reviewed by `reviewer` before it merges (plans/bin/swarm): APPROVE
# merges it, CHANGES sends it back to its author. After max_rounds reviews it goes to a human.
review:
  reviewer: dspro
  max_rounds: 3
  tasks: [U01, U02, U03, U04, U05, U06, U07, U08, Q11, Q12, Q14, R06, P07, P08, B08, B09]

agents:
  claude:
    model: Claude Opus 5.5 (medium)
    command: [claude, -p, "{prompt}", --model, claude-opus-5-5, --effort, "{effort}",
              --permission-mode, bypassPermissions]
    effort: medium
    slots: 2
    # Fresh quota: the pin, forgery protection, the page cache and perf round 2.
    queue: [U01, U03, U07, B08]

  gemini:
    model: Gemini 3.8 Flash (high) via Antigravity
    command: [agy, -p, "{prompt}", --model, gemini-3.8-flash-high, --dangerously-skip-permissions]
    # The route chain: small features, the coverage gate, then the Playwright and cable gates.
    slots: 2
    # R04 moved here from grok when Grok's usage balance ran out.
    # P05 wires the real cable server, job runner and revoker into `campfire server`.
    # Q10 finishes fixes that agents requested on issues after those issues closed.
    # Batch 2: the upstream ports and gates, the verification harness and AOT.
    queue: [U02, U04, U05, U06, U08, Q11, Q12, B07, B09, X01]

  grok:
    model: Grok 4.7 (high)
    command: [grok, --cwd, "{worktree}", -m, grok-4.7, --reasoning-effort, high, --always-approve,
              --output-format, plain, -p, "{prompt}"]
    # The benchmark chain, plus the cross-vendor security review of R04 and RT04.
    slots: 2
    # R04 and M10 moved here when Fireworks (glm, deepseek) ran out of credits, so Q08's review
    # of R04 went to dspro: a reviewer can't review its own work.
    # Out of usage balance (402): R04 moved to gemini, the benchmark chain to dspro.
    queue: []

  glm:
    model: GLM 5.3 (high) via OpenCode
    command: [opencode, run, --standalone, --auto, -m, "fireworks-ai/accounts/fireworks/models/glm-5p3#high",
              "{prompt}"]
    # Attachments and the media toolchain go together; Q04 is harness work against the reference.
    slots: 2
    # R04, taken over from Claude, also fixes what its fuzzer found in merged tasks' code.
    # P02 and Q04 moved to dspro so glm can focus on R04 and M10.
    # Out of Fireworks credits: R04 and M10 moved to grok.
    queue: []

  deepseek:
    model: DeepSeek V4.1 Flash via OpenCode
    command: [opencode, run, --standalone, --auto, -m,
              "fireworks-ai/accounts/fireworks/models/deepseek-v4p1-flash", "{prompt}"]
    # Added to take load off Claude's quota.
    slots: 1
    # Out of Fireworks credits: Q09 moved to dspro.
    queue: []

  dspro:
    model: DeepSeek V4 Pro via OpenRouter (OpenCode)
    command: [opencode, run, --standalone, --auto, -m, "openrouter/deepseek/deepseek-v4-pro",
              "{prompt}"]
    # Cheap ($0.21/M in, $0.02/M cache read); takes P02 (continuing glm's attempt) and Q04.
    slots: 2
    # The benchmark chain moved here from grok when Grok's usage balance ran out.
    # Batch 2: reviews every PR in `review` (counted against these slots) and does Q13.
    queue: [Q13]

  haiku:
    model: Claude Haiku 5.5 via OpenRouter (OpenCode)
    command: [opencode, run, --standalone, --auto, -m, "openrouter/anthropic/claude-haiku-5.5",
              "{prompt}"]
    # Cheap and fast ($0.10/M in, $0.50/M out) for small, well-specified fixes.
    slots: 2
    queue: [P07, Q14, R06, P08]
