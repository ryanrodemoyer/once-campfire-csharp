name: Release

# Publishes the production image to GitHub Container Registry when a version tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# gives ghcr.io/ryanrodemoyer/once-campfire-csharp:1.0.0, :1.0 and :latest, for linux/amd64 and
# linux/arm64. A pre-release tag such as v1.0.0-rc.1 gets its own tags but not :latest. The image is
# the one tests/image-smoke checks on every pull request.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_REVISION=${{ github.sha }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_DESCRIPTION=Campfire, Basecamp's group chat, ported from Rails to C#
          cache-from: type=gha
          cache-to: type=gha,mode=max
